version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fitmi-postgres
    environment:
      POSTGRES_DB: fitmi_db
      POSTGRES_USER: fitmi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./fitmi_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitmi_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - fitmi-network

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitmi-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fitmi_db
      DB_USER: fitmi_user
      DB_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: always
    networks:
      - fitmi-network

  # Frontend React App
  frontend:
    build:
      context: ./fitmi-frontend
      dockerfile: Dockerfile
    container_name: fitmi-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: always
    networks:
      - fitmi-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: fitmi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - fitmi-network

volumes:
  postgres_data:

networks:
  fitmi-network:
    driver: bridge
